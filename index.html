<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interschool Corner of Learning</title>
<meta name="description" content="Sunday reading log for Interschool Corner of Learning tutors.">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* Layout: open plane. A 232px labelled sidebar on the page ground, then a centred 1100px column on a 12-column grid
   (12 x 77 + 11 x 16 = 1100). Rows split 3/3/3/3, then 3 + 9, so every inner edge meets one above it. */
html, body { margin: 0; }
:root {
  --ground: #ffffff; --surface: #f6f7f5; --raised: #ffffff; --border: #e6e8e4; --rule: #eff1ed; --control: #d9dbd6;
  --text: #1f201d; --muted: #61635e; --accent: #1b6e66; --accent-ink: #ffffff; --accent-soft: #e3f1ef;
  --negative: #b42318; --neg-bg: #fdecea; --neg-ink: #7a1d14;
  --pos-bg: #dcfae5; --pos-ink: #04250e; --warn-bg: #fff6df; --warn-ink: #7a3a0b;
  --chip: #eceeea; --chip-ink: #3d3f3a; --pill: #e9ebe7;
  --sans: "Instrument Sans", "Segoe UI", system-ui, sans-serif; --serif: "Instrument Serif", Georgia, serif;
  --fs-title: 48px; --fs-kpi: 32px; --fs-body: 14px; --fs-small: 12px;
  --r-card: 22px; --r-row: 14px; --gap: 16px; --pad: 20px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #131412; --surface: #1b1c1a; --raised: #222320; --border: #30322e; --rule: #262824; --control: #3a3c37;
  --text: #ecebe6; --muted: #a4a59f; --accent: #5cbcb0; --accent-ink: #0d1f1d; --accent-soft: #1b302d;
  --negative: #f08b80; --neg-bg: #3b1d1a; --neg-ink: #ffc2bb; --pos-bg: #173322; --pos-ink: #bff0cf; --warn-bg: #3a2c12; --warn-ink: #f7d48f;
  --chip: #2a2c28; --chip-ink: #d6d6d0; --pill: #2a2c28; color-scheme: dark; } }
:root[data-theme="dark"] {
  --ground: #131412; --surface: #1b1c1a; --raised: #222320; --border: #30322e; --rule: #262824; --control: #3a3c37;
  --text: #ecebe6; --muted: #a4a59f; --accent: #5cbcb0; --accent-ink: #0d1f1d; --accent-soft: #1b302d;
  --negative: #f08b80; --neg-bg: #3b1d1a; --neg-ink: #ffc2bb; --pos-bg: #173322; --pos-ink: #bff0cf; --warn-bg: #3a2c12; --warn-ink: #f7d48f;
  --chip: #2a2c28; --chip-ink: #d6d6d0; --pill: #2a2c28; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--ground); color: var(--text); }
body { font: 400 var(--fs-body)/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 28px 12px 20px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--rule); }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 10px; }
.brand svg { flex: none; }
.brand b { display: block; font-weight: 600; font-size: 14px; line-height: 1.2; }
.brand span { color: var(--muted); font-size: 12px; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border: 0; background: none; border-radius: 9px; cursor: pointer; text-align: left; color: var(--muted); }
.nav button svg { width: 16px; height: 16px; flex: none; }
.nav button:hover { color: var(--text); }
.nav button[aria-current="page"] { background: var(--pill); color: var(--text); }
.side .me { margin-top: auto; padding: 10px; border-radius: 12px; background: var(--surface); font-size: 13px; }
.side .me b { display: block; font-weight: 500; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
.linkish:hover { text-decoration: underline; }
.topbar { display: none; }
main { min-width: 0; padding: 36px max(16px, env(safe-area-inset-right, 0px)) 80px max(16px, env(safe-area-inset-left, 0px)); }
.col { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); }
.col > * { grid-column: 1 / -1; min-width: 0; }
.s3 { grid-column: span 3 !important; } .s9 { grid-column: span 9 !important; } .s6 { grid-column: span 6 !important; } .s4 { grid-column: span 4 !important; } .s8 { grid-column: span 8 !important; }

/* Title row */
.title-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 34px; }
.greet { font: 400 var(--fs-title)/1.02 var(--serif); letter-spacing: -0.01em; }
.h1 { font-size: 24px; font-weight: 500; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 15px; margin-top: 8px; }
.back { margin-bottom: 10px; }

/* Tiles and panels */
.tile { background: var(--surface); border-radius: var(--r-card); padding: 16px 18px; min-height: 120px; display: flex; flex-direction: column; }
.tile .k { color: var(--muted); font-size: 13px; }
.tile .v { font-size: var(--fs-kpi); line-height: 1.1; margin-top: auto; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tile .v small { font-size: 15px; color: var(--muted); margin-left: 4px; }
.tile .c { color: var(--muted); font-size: 12px; margin-top: 4px; }
.panel { background: var(--surface); border-radius: var(--r-card); padding: var(--pad); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-head h2 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.count { font-size: 12px; font-weight: 500; background: var(--chip); color: var(--chip-ink); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.stack { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 14px; background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-row); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 500; }
.row .m { color: var(--muted); font-size: 12px; }
.rows-gap { margin-top: 8px; }
.empty { padding: 22px; border: 1px dashed var(--control); border-radius: var(--r-row); color: var(--muted); }
.empty b { color: var(--text); font-weight: 500; display: block; margin-bottom: 2px; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; border: 0; cursor: pointer; background: var(--pill); color: var(--text); font-weight: 500; white-space: nowrap; transition: transform .08s ease, background-color .15s ease; }
.btn:hover { background: var(--control); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.quiet { background: none; }
.btn.quiet:hover { background: var(--pill); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
input[type=text], input[type=password], input[type=search], select, textarea { height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--control); background: var(--raised); min-width: 0; }
textarea { height: auto; padding: 10px 14px; resize: vertical; width: 100%; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inline input { flex: 1 1 200px; }
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--chip); color: var(--chip-ink); font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip.good { background: var(--pos-bg); color: var(--pos-ink); }
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
.chip.bad { background: var(--neg-bg); color: var(--neg-ink); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }

/* Sign-in */
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.name-btn { height: 56px; border-radius: var(--r-row); border: 1px solid var(--border); background: var(--raised); cursor: pointer; text-align: left; padding: 0 16px; font-weight: 500; transition: border-color .15s ease, transform .08s ease; }
.name-btn:hover { border-color: var(--accent); }
.name-btn:active { transform: scale(.98); }
.name-btn.here { border-color: var(--accent); background: var(--accent-soft); }

/* Kid tabs */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tab { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--border); background: var(--raised); cursor: pointer; font-weight: 500; font-size: 15px; }
.tab:hover { border-color: var(--control); }
.tab[aria-selected="true"] { background: var(--text); color: var(--ground); border-color: var(--text); }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.tab[aria-selected="true"] .dot { background: var(--ground); }

/* Catch-up */
.catch h3 { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
.facts { display: grid; gap: 12px; margin-top: 16px; }
.facts .k { color: var(--muted); font-size: 12px; }
.facts .v { font-size: 14px; }
.words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.note { background: var(--raised); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.moveup { background: var(--pos-bg); color: var(--pos-ink); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; margin-top: 16px; }

/* Reader */
.reader { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-card); padding: 20px 24px 24px; }
.reader-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
.reader-bar .ttl { font-weight: 600; font-size: 16px; }
.timer { font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; min-width: 76px; text-align: right; }
.story { --size: 36px; font-size: var(--size); line-height: 1.75; padding: 28px 4px 12px; max-width: 30em; word-spacing: .08em; }
.story h2 { font-size: calc(var(--size) * 1.1); font-weight: 600; margin-bottom: 12px; letter-spacing: -0.01em; }
.w { border: 0; background: none; padding: 0 .06em; margin: 0; cursor: pointer; border-radius: 6px; font-size: inherit; line-height: inherit; color: var(--text); text-decoration: none; }
.w:hover { background: var(--surface); }
.w.miss { text-decoration: underline 3px var(--negative); text-underline-offset: .18em; color: var(--neg-ink); }
.reader-foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; padding-top: 16px; border-top: 1px solid var(--rule); }
.tricky { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }

/* Placement grid */
.grid-items { display: grid; gap: 8px; padding: 24px 0 12px; }
.grid-items.letters { grid-template-columns: repeat(10, minmax(0, 1fr)); font-size: 34px; }
.grid-items.nwords { grid-template-columns: repeat(5, minmax(0, 1fr)); font-size: 30px; }
.gi { height: 72px; border-radius: 14px; border: 1px solid var(--border); background: var(--raised); cursor: pointer; font-size: inherit; }
.gi:hover { border-color: var(--control); }
.gi.miss { background: var(--neg-bg); color: var(--neg-ink); border-color: transparent; }
.band-label { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: 6px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }

/* Results */
.result-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 16px 0; }
.result-nums .tile { min-height: 96px; background: var(--surface); }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 12px 10px; white-space: nowrap; }
td { padding: 12px; border-top: 1px solid var(--border); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--raised); }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart .axis { fill: var(--muted); font-size: 12px; font-family: var(--sans); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 14px; padding: 12px 16px; font-size: 13px; margin-bottom: 20px; max-width: 1100px; margin-inline: auto; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--ground); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 30; box-shadow: 0 6px 24px rgba(0,0,0,.18); }

@media (max-width: 1000px) {
  .s3, .s9, .s6, .s4, .s8 { grid-column: 1 / -1 !important; }
  .tiles .s3 { grid-column: span 6 !important; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 52px; align-items: center; gap: 8px; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); background: var(--ground); border-bottom: 1px solid var(--rule); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
  .topbar .nav { display: flex; margin-left: auto; gap: 2px; }
  .topbar .nav button { padding: 0 10px; }
  .topbar .nav button svg { display: none; }
  main { padding-top: 22px; }
  :root { --fs-title: 34px; --fs-kpi: 26px; }
  .tile { min-height: 96px; }
  .story { --size: 24px; padding-top: 18px; }
  .grid-items.letters { grid-template-columns: repeat(5, minmax(0, 1fr)); font-size: 26px; }
  .grid-items.nwords { grid-template-columns: repeat(2, minmax(0, 1fr)); font-size: 24px; }
  .gi { height: 58px; }
  .reader { padding: 16px; }
  .reader-foot { grid-template-columns: 1fr; }
  .result-nums { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Lesson page */
.kidbar { position: sticky; top: 0; z-index: 15; background: var(--ground); display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; margin: -12px 0 8px; border-bottom: 1px solid var(--rule); }
.kidtabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.kidtabs::-webkit-scrollbar { display: none; }
.tab { height: auto; min-height: 48px; padding: 6px 18px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; line-height: 1.25; white-space: nowrap; }
.tab .st { font-size: 12px; font-weight: 400; opacity: .72; }
.tab.needs .st { opacity: 1; color: var(--warn-ink); }
.tab[aria-selected="true"].needs .st { color: var(--ground); }
.plan { display: flex; gap: 8px; flex-wrap: wrap; }
.step { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--raised); cursor: pointer; font-weight: 500; transition: border-color .15s ease, transform .08s ease; }
.step:hover { border-color: var(--accent); }
.step:active { transform: scale(.97); }
.step.done { background: var(--pos-bg); color: var(--pos-ink); border-color: transparent; }
.step svg { width: 14px; height: 14px; }
.row.added { border-color: var(--accent); background: var(--accent-soft); }
.pickbar { position: sticky; bottom: 0; z-index: 12; background: var(--ground); padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--rule); margin-top: 8px; }
.flash-word { font-size: clamp(64px, 11vw, 150px); line-height: 1.1; text-align: center; padding: 56px 0 48px; letter-spacing: -0.02em; font-weight: 500; overflow-wrap: anywhere; }
.flash-btns { display: flex; justify-content: center; gap: 12px; }
.flash-btns .btn { height: 52px; padding: 0 32px; font-size: 16px; }
.qs { display: grid; gap: 0; }
.q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 18px 0; border-top: 1px solid var(--rule); }
.q:first-child { border-top: 0; }
.qt { font-size: 26px; line-height: 1.3; }
.qa { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
.seg { display: inline-flex; background: var(--pill); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: none; cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"].ok { background: var(--pos-bg); color: var(--pos-ink); }
.seg button[aria-pressed="true"].no { background: var(--neg-bg); color: var(--neg-ink); }
.story p + p { margin-top: .6em; }
.genlog { display: grid; gap: 4px; font-size: 13px; margin-top: 12px; }
.storyprev { background: var(--raised); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; margin-top: -2px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--raised); border: 1px solid var(--border); font-size: 13px; cursor: pointer; }
.checks input { accent-color: var(--accent); }
.spin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--control); border-top-color: var(--accent); animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
a.btn { text-decoration: none; }
@media (max-width: 760px) {
  .kidbar { top: calc(52px + env(safe-area-inset-top, 0px)); flex-wrap: wrap; }
  .flash-word { padding: 36px 0 28px; }
  .qt { font-size: 20px; }
  .q { grid-template-columns: 1fr; }
}

/* Story list */
.ai-card { display: flex; gap: 16px; align-items: center; padding: 16px 18px; border-radius: 16px; background: var(--accent-soft); margin-bottom: 18px; }
.ai-card .t { font-weight: 600; font-size: 15px; }
.ai-card .m { color: var(--muted); font-size: 13px; margin-top: 2px; }
.ai-card .grow { flex: 1; min-width: 0; }
.progress-line { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.progress-line .bar { flex: 1; height: 8px; border-radius: 999px; background: var(--control); overflow: hidden; }
.progress-line .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.group-h { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.row.upnext { border-color: var(--accent); }
.row.done { background: transparent; }
.row.done .t { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); font-weight: 400; }
.group-toggle { display: flex; align-items: center; gap: 8px; width: 100%; margin: 18px 0 8px; padding: 10px 14px; border: 1px dashed var(--control); border-radius: var(--r-row); background: none; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; }
.group-toggle:hover { color: var(--text); border-color: var(--muted); }
@media (max-width: 760px) { .ai-card { flex-direction: column; align-items: stretch; } }

/* Fixes and hints */
.movedown { background: var(--warn-bg); color: var(--warn-ink); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; margin-top: 16px; }
.nudge { animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.timer-hint { margin-top: 12px; padding: 10px 14px; border-radius: 12px; background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; }
.asktime { margin-top: 12px; padding: 14px 16px; border-radius: 14px; background: var(--warn-bg); color: var(--warn-ink); display: grid; gap: 10px; }
.asktime .muted { color: inherit; opacity: .85; }
.undo-line { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.muted-link { color: var(--muted); }
.btn.danger { background: var(--neg-bg); color: var(--neg-ink); }
.btn.danger:hover { filter: brightness(.97); }
tr.fix td { background: var(--raised); border-top: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .nudge { animation: none; } }

/* Attendance calendar */
.cal-wrap { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-dow { font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cal-cell { aspect-ratio: 1 / .82; border-radius: 12px; border: 1px solid var(--border); background: var(--raised); display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 6px 8px; cursor: pointer; font: inherit; color: var(--text); text-align: left; min-width: 0; }
.cal-cell.blank { border: 0; background: none; cursor: default; }
.cal-cell .d { font-size: 12px; color: var(--muted); }
.cal-cell.sun .d { color: var(--text); font-weight: 600; }
.cal-cell .n { font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.cal-cell .l { font-size: 11px; color: var(--muted); margin-top: -4px; }
.cal-cell.has { background: color-mix(in srgb, var(--accent) var(--tint), var(--raised)); border-color: transparent; }
.cal-cell.has .d, .cal-cell.has .l { color: inherit; opacity: .8; }
.cal-cell.sel { outline: 2px solid var(--text); outline-offset: 1px; }
.cal-cell.today { border-color: var(--accent); }
.cal-cell:not(.blank):hover { border-color: var(--muted); }
.cal-detail { background: var(--raised); border: 1px solid var(--border); border-radius: 16px; padding: 16px; min-width: 0; }
.cal-h { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
table.att th.c, table.att td.c { text-align: center; padding-left: 6px; padding-right: 6px; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--control); }
.dot.yes { background: var(--accent); border-color: var(--accent); }
@media (max-width: 760px) { .cal-wrap { grid-template-columns: 1fr; } .cal-cell { padding: 4px 5px; border-radius: 8px; } .cal-cell .n { font-size: 15px; } .cal-cell .l { display: none; } }


/* Guided lesson */
.stepper { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.stp { display: grid; grid-template-columns: 20px minmax(0, 1fr); grid-template-rows: auto; column-gap: 8px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--border); background: var(--raised); cursor: pointer; min-width: 0; transition: border-color .15s ease; }
.stp:hover { border-color: var(--muted); }
.stp-n { grid-row: 1; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--control); display: grid; place-items: center; }
.stp-n svg { width: 12px; height: 12px; }
.stp-l { font-weight: 500; font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
.stp-m { font-size: 11px; color: var(--muted); }
.stp.done { background: var(--pos-bg); border-color: transparent; color: var(--pos-ink); }
.stp.done .stp-n { background: var(--pos-ink); border-color: var(--pos-ink); color: var(--pos-bg); }
.stp.done .stp-m { color: inherit; opacity: .75; }
.stp.cur { background: var(--text); color: var(--ground); border-color: var(--text); }
.stp.cur .stp-n { border-color: var(--ground); background: var(--ground); }
.stp.cur .stp-m { color: inherit; opacity: .7; }
.stepper-note { margin: -6px 0 2px; }
.script { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); }
.script-k { flex: none; font-size: 11px; font-weight: 600; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 2px 9px; margin-top: 2px; }
.script p { font-size: 15px; line-height: 1.5; }
.plan-list { margin: 0; padding-left: 22px; display: grid; gap: 10px; }
.plan-list li { padding-left: 4px; }
.plan-list b { display: block; font-weight: 600; }
.plan-list span { color: var(--muted); font-size: 13px; }
.btn.big { height: 46px; padding: 0 22px; font-size: 15px; }
.prep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--gap); }
.prep-box { background: var(--raised); border: 1px solid var(--border); border-radius: 16px; padding: 16px; min-width: 0; }
.prep-box h3 { font-size: 15px; font-weight: 600; }
.prep-box.warnbox { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.prep-box.warnbox .muted { color: inherit; opacity: .8; }
.bigwords { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.bigwords.xl span { font-size: 40px; padding: 8px 20px; }
.bigwords span { font-size: 26px; font-weight: 500; padding: 4px 14px; border-radius: 12px; background: var(--surface); letter-spacing: -0.01em; }
.warnbox .bigwords span { background: rgba(255,255,255,.45); }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--gap); }
.choice { display: grid; gap: 6px; text-align: left; padding: 18px; border-radius: 16px; border: 1px solid var(--border); background: var(--raised); cursor: pointer; transition: border-color .15s ease, transform .08s ease; }
.choice:hover { border-color: var(--accent); }
.choice:active { transform: scale(.99); }
.choice b { font-size: 16px; font-weight: 600; }
.choice span { color: var(--muted); font-size: 13px; }
@media (max-width: 1000px) { .stepper { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 760px) { .stepper { display: flex; overflow-x: auto; scrollbar-width: none; } .stp { flex: none; width: 132px; } .bigwords span { font-size: 21px; } }

/* Sign-in */
.btn.google { background: var(--raised); color: var(--text); border: 1px solid var(--control); height: 46px; padding: 0 20px; font-size: 15px; gap: 10px; }
.btn.google:hover { border-color: var(--muted); background: var(--raised); }
.pending-panel { background: var(--warn-bg); }
.pending-panel .panel-head h2 { color: var(--warn-ink); }
input[type=email] { height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--control); background: var(--raised); min-width: 0; flex: 1 1 200px; }

/* Turns and lesson clock */
.turnline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.turn-chip { font-weight: 600; font-size: 14px; background: var(--text); color: var(--ground); border-radius: 999px; padding: 4px 12px; }
.stepper.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.upnext-card { display: flex; gap: 16px; align-items: center; padding: 18px 20px; border-radius: 16px; background: var(--accent-soft); }
.upnext-card .grow { flex: 1; min-width: 0; }
.upnext-card .t { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.upnext-card .m { color: var(--muted); font-size: 13px; }
.lclock { font-size: 13px; color: var(--muted); padding: 6px 12px; border-radius: 999px; background: var(--surface); font-variant-numeric: tabular-nums; }
.lclock b { color: var(--text); font-weight: 600; }
.lclock.soon { background: var(--warn-bg); color: var(--warn-ink); }
.lclock.soon b, .lclock.over b { color: inherit; }
.lclock.over { background: var(--neg-bg); color: var(--neg-ink); }
@media (max-width: 760px) { .stepper.four { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); } .stepper.four .stp { width: auto; } .upnext-card { flex-direction: column; align-items: stretch; } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } }
</style>
</head>
